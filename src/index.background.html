<!DOCTYPE html>
<html>
<head>
  <title>Logical Layout — Background Image</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background-image: url("https://logicallayout.blob.core.windows.net/$web/img/_53a6b975-4b41-4d80-aa21-9021cbe67337.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color: #fff;
    }
    .panel {
      margin-top: 2rem;
      background: rgba(0, 0, 0, 0.45);
      padding: 1.25rem 1.5rem;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      max-width: 820px;
      width: calc(100% - 4rem);
    }
    h1 { margin: 0 0 0.5rem 0; font-size: 1.75rem; }
    p { margin: 0; opacity: 0.95 }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Proto-Logical Layout</h1>
    <p>The image has been moved to the page background (see CSS in the head).</p>
  </div>
</body>
</html>
